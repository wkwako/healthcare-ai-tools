name: Lint

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      #pinned so a new ruff release with new rules can't start failing the build on its own
      - run: pip install ruff==0.17.4

      #the rules are in pyproject.toml under [tool.ruff]
      - run: ruff check .
