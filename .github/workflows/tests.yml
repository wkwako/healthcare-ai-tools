name: Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python -m pytest

  deploy:
       needs: test
       if: github.event_name == 'push' && github.ref == 'refs/heads/master'
       runs-on: ubuntu-latest

       steps:
         - name: Set up SSH
           run: |
             mkdir -p ~/.ssh
             printf '%s\n' "${{ secrets.VM_SSH_KEY }}" | tr -d '\r' > ~/.ssh/deploy_key
             chmod 600 ~/.ssh/deploy_key
             ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts

         - name: Deploy
           run: |
             ssh -i ~/.ssh/deploy_key ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} \
               "cd ~/healthcare-ai-tools && git pull && ~/.local/bin/uv sync && sudo systemctl restart healthcare-ai-tools"

         - name: Check the site is up
           run: |
             sleep 10
             curl -fsS https://healthcare.williamkwako.com > /dev/null