[project]
name = "healthcare-ai-tools"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "William Kwako", email = "wkwakow@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "bs4>=0.0.2",
    "chromadb>=1.5.9",
    "fastapi>=0.143.0",
    "pandas>=3.0.6",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[tool.pytest.ini_options]
markers = [
    "retrieval: searches the Chroma vector store (needs it built; run python policy_store.py)",
]

[project.scripts]
healthcare-ai-tools = "healthcare_ai_tools:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
